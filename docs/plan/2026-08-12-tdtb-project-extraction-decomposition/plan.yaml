conventions:
  - The canonical TDTB repository is /Users/walle-mini/Repos/Projects/TDTB.
  - Claudius remains the shared skill, ritual, plan, report, and integration host.
  - Child plans communicate through named receipts and handoff artifacts.
  - Migration and rewiring use path-scoped changes and preserve unrelated dirty work.
  - No live action is inferred from a repository or test pass.
  - Historical references are classified, not erased.
constraints:
  hard:
    - Do not edit the existing combined plan or its evidence during decomposition.
    - Do not migrate, rewire, implement, restart, cut over, or commit in this task.
    - Migration must not depend on docs/PRD.yaml, current DESIGN.md, or live cutover.
    - Rewiring must not change the loaded launchd job or running process.
    - Implementation must target only the canonical TDTB repository after both upstream gates.
    - Cutover is the only workstream allowed to change live launchd or process state.
    - Do not copy source .git directories or claim that Claudius history was imported.
    - Do not read or copy credentials, provider tokens, vault data, or machine-local state.
  soft:
    - Keep the old source app tree as a clearly marked fallback until cutover succeeds.
    - Regenerate generated UI output in the canonical repository after source verification.
  compatibility:
    - Preserve the existing FastAPI, Preact, TypeScript, Vite, Vitest, uv, and npm contracts.
    - Preserve shared TDTB skills and rituals in Claudius.
  security_requirements:
    - Use bounded manifests and hashes for all migration material.
    - Use fake, synthetic, or scratch data for implementation verification.
    - Require attended approval before any production runtime mutation.
