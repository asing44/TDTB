pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Migration copies an unapproved collision or generated file.
      likelihood: medium
      impact: critical
      mitigation: Require a sealed map, collision manifest, generated exclusions, and hashes.
    - scenario: Rewiring changes a live consumer while updating Claudius references.
      likelihood: medium
      impact: critical
      mitigation: Limit rewiring to non-live files and defer loaded runtime changes to CUTOVER.
    - scenario: Implementation starts without migration or rewiring proof.
      likelihood: medium
      impact: critical
      mitigation: Require both named handoff artifacts before IMP-01 can pass.
    - scenario: Missing PRD or DESIGN is silently replaced by historical material.
      likelihood: high
      impact: high
      mitigation: Make input resolution a visible implementation task with approval or waiver.
    - scenario: A failed cutover claims success without verified rollback or resume.
      likelihood: medium
      impact: critical
      mitigation: Use a preimage, pause gate, recovery barrier, and GET-only operational proof.
coordination_notes:
  - Execute child plans in dependency order: migration, rewiring, implementation, then cutover.
  - Migration output must explicitly state that PRD, DESIGN, and cutover were not required.
  - Rewiring output must classify the source live consumer as pre-cutover, not broken.
  - Implementation output must include its PRD/DESIGN decision record and no live-write proof.
  - Cutover output must be optional and must never be a prerequisite for the first three gates.
