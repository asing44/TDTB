pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: A different Claudius checkout is selected as source.
      likelihood: medium
      impact: critical
      mitigation: Require exact absolute roots, Git identity, branch, HEAD, and receipt-path agreement in M1 before any copy.
    - scenario: Source bytes change after the current receipt and before staging.
      likelihood: medium
      impact: critical
      mitigation: Seal a current source receipt, compare it immediately before staging, and recapture or abort on drift.
    - scenario: A destination collision overwrites plan, policy, or repository files.
      likelihood: medium
      impact: high
      mitigation: Produce a normalized collision manifest, preserve destination bytes, and allow only approved map entries.
    - scenario: A partial or lossy copy passes a shallow directory check.
      likelihood: medium
      impact: critical
      mitigation: Stage first and compare every mapped file's bytes, mode, symlink target, and text or binary hash.
    - scenario: A stale Claudius consumer still launches or tests the old app after cutover preparation.
      likelihood: high
      impact: high
      mitigation: Rewire non-live consumers, classify the active source process as pre-cutover, require M12 approval, and verify after cutover.
    - scenario: A writer changes source bytes after receipt and before staging.
      likelihood: medium
      impact: critical
      mitigation: Require M3Q to pause or prove quiescence for every known writer and abort on any receipt mismatch.
    - scenario: A writer is paused but cannot be safely resumed or resume is not verified.
      likelihood: medium
      impact: critical
      mitigation: M6R must verify resume for every paused writer after copy verification; any uncertainty fails closed.
    - scenario: Live launchd or process cutover occurs without attended approval.
      likelihood: low
      impact: critical
      mitigation: Make M12 a production devops task with requires_approval true and no other task allowed to change live state.
    - scenario: Destination provenance is mistaken for imported Claudius history.
      likelihood: medium
      impact: high
      mitigation: Exclude source .git, record remote/HEAD and per-entry hashes, and state full history import is out of scope.
    - scenario: Prior freeze cleanup deletes evidence or unrelated dirty work.
      likelihood: medium
      impact: critical
      mitigation: Keep the original receipt, hash all known side effects, use supported lifecycle operations, and fail closed on drift.
    - scenario: Implementation begins before migration is complete.
      likelihood: medium
      impact: critical
      mitigation: Make every I task depend on M11 and require M11 to assert the canonical target and consumer gates are green.
coordination_notes:
  - M0 and M1 may run in parallel; no migration mutation may start until their outputs are available.
  - M2 and M3 may run in parallel after M1 because they write separate evidence and both precede the collision map.
  - M4, M3Q, M5, M6, M6R, M7, M8, M9, M10, and M11 are serialized migration gates.
  - M3Q performs pause and pre-copy verification; M6R performs post-copy resume verification.
  - I1 and D1 may run in parallel after M11; D1 is read-only design validation and must finish before I5.
