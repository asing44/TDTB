pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: A shared skill is moved or rewritten as an app consumer.
      likelihood: medium
      impact: critical
      mitigation: Require a consumer inventory with ownership class before any path edit.
    - scenario: Rewiring activates the live source or destination process accidentally.
      likelihood: low
      impact: critical
      mitigation: Exclude loaded launchd/process state and require CUTOVER for activation.
    - scenario: Historical references are deleted to make the sweep appear clean.
      likelihood: medium
      impact: high
      mitigation: 'Require disposition values: operational, shared, historical, fallback, or broken.'
    - scenario: Implementation begins from an incomplete rewiring result.
      likelihood: medium
      impact: high
      mitigation: RW-06 must include all changed paths, sweep output, and live fallback classification.
