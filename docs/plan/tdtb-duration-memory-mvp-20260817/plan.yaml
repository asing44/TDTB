conventions:
  - Extend app/duration_memory.py and existing cache, token, adapter, and store seams.
  - Resolve vault_root per request and derive cache paths beneath 00 - META/Cache.
  - Use stable Todoist IDs or normalized vault paths, never display names.
  - Keep source systems authoritative; duration memory changes only planner projection.
  - Preserve tdtb-session-v2 as same-day browser state with date-rollover invalidation.
constraints:
  hard:
    - Product work occurs only in /Users/walle-mini/Repos/Projects/features/duration-memory.
    - The branch is exactly features/duration-memory and its base commit is recorded before edits.
    - Never use live :8746, billed endpoints, the real vault, Todoist, Calendar, or source-note writes.
    - Use tmp_path fixtures or scratch :8790 with a temporary vault root.
    - Require X-TDTB-Token for save and reset mutations.
    - Reject bools, fractions, negatives, and values not divisible by 5 without coercion.
    - Missing, corrupt, and unsupported caches fail open on read to source duration.
    - Unsafe writes fail closed and preserve existing durable bytes.
    - Never stage, commit, push, reset, clean, pull, rebase, merge, or alter foreign state.
    - No separate critic pass is permitted; FT-04 is the only final review gate.
  soft:
    - Extend existing modules and conventions rather than introduce a new subsystem.
    - Keep save and reset explicit; do not add automatic durable writes.
    - Keep UI changes within existing duration controls and visual language.
  compatibility:
    - Missing cache state behaves exactly like no remembered duration.
    - Existing clients without duration-memory data retain source-resolved behavior.
    - Existing same-day localStorage restore and date rollover remain unchanged.
  security_requirements:
    - Persist only canonical identity and duration-memory metadata needed by the MVP.
    - Do not persist tokens, source bodies, plans, approvals, or free text.
    - Do not expose absolute vault paths, raw corrupt content, or a bulk memory browser.

architecture_snapshot:
  current:
    backend: app/duration_memory.py has identity, precedence, and optional atomic JSON seams.
    planner: GET /plan-inputs in app/main.py is the rehydration entry point.
    frontend: ApiAdapter, store/controller, and duration controls own explicit user intent.
    browser_state: frontend/src/store/persist.ts owns date-scoped tdtb-session-v2 behavior.
  mvp_target:
    cache: 00 - META/Cache/tdtb-duration-memory.json below resolved vault_root.
    read: GET /plan-inputs overlays valid remembered values without duration-cache writes.
    write: Token-guarded explicit save and reset use locked read-modify-write and atomic replace.
    fallback: Missing, corrupt, or unsupported cache data returns source-resolved durations.

