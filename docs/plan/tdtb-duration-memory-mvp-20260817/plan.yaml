plan_id: tdtb-duration-memory-mvp-20260817
objective: Implement a usable duration-memory MVP in an isolated features/duration-memory worktree.
complexity: MEDIUM
created_at: '2026-08-17T00:00:00Z'
created_by: gem-planner
status: pending
tldr: |
  - Ship vault-scoped duration memory with locked atomic writes and planner rehydration.
  - Add explicit save and per-item reset without changing same-day browser restore behavior.
  - Prove persistence with scratch :8790 across a fresh server process.
  - Defer advanced concurrency and recovery hardening behind one lightweight final review.

baseline:
  objective: Implement a usable duration-memory MVP in an isolated features/duration-memory worktree.
  acceptance_criteria:
    - A valid explicit duration saves to a cache scoped to the resolved scratch vault root.
    - A later GET rehydrates the remembered duration after the scratch server process is replaced.
    - Explicit reset removes the remembered value and restores the current source-resolved duration.
    - Writes are locked and atomic; invalid or unsafe writes do not replace valid durable data.
    - Missing, corrupt, or unsupported cache data falls back to the source-resolved duration.
    - Values are integers at least zero and divisible by 5; bools and fractions are rejected.
    - Stable Todoist IDs or normalized vault paths identify entries; mutations require the session token.
    - Existing tdtb-session-v2 same-day restore and date-rollover invalidation remain compatible.
    - Verification uses tmp_path or scratch :8790 and records zero real-source and billed writes.
    - No automatic stage, commit, push, live :8746 use, or foreign worktree mutation occurs.
  captured_at: '2026-08-17T00:00:00Z'

