pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: A duration edit is keyed by display name and applies to the wrong item after a rename or collision.
      likelihood: medium
      impact: high
      mitigation: Reject writes without canonical Todoist ID or vault path and test rename and collision cases.
    - scenario: Two processes update different identities and the later writer drops the earlier update.
      likelihood: medium
      impact: high
      mitigation: Use a stable sidecar lock with timeout across fresh read, merge, fsync, and atomic replacement.
    - scenario: Recovery cleanup removes a newer candidate or promotes a stale temp over committed state.
      likelihood: medium
      impact: high
      mitigation: Never promote temps; compare generations and preserve newer unknown candidates under lock.
    - scenario: A corrupt cache is read as empty and the next edit destroys recoverable user memory.
      likelihood: medium
      impact: high
      mitigation: Mark corruption explicitly, preserve the file, fail writes closed, and surface a bounded warning.
    - scenario: A delayed save arrives after reset or clear-all and recreates a preference the user deleted.
      likelihood: medium
      impact: high
      mitigation: Require matching store tokens and entry revisions; re-fetch and retry the latest user intent.
    - scenario: Reset succeeds on disk but the UI keeps a remembered value after source refresh fails.
      likelihood: medium
      impact: high
      mitigation: Return the source-resolved fallback in the delete response, then re-fetch and warn on failure.
    - scenario: Atomic replacement is visible but not durable after a crash or leaves sensitive temp copies.
      likelihood: low
      impact: high
      mitigation: Fsync file and parent directory and clean matching temp copies under the sidecar lock.
    - scenario: Rehydrated state bypasses validation or restores unsafe approval state.
      likelihood: low
      impact: critical
      mitigation: Rehydrate only duration input values; keep sequence, shadow, acceptance, and arming contracts unchanged.
    - scenario: Save-on-load writes defaults as user preferences and permanently masks source changes.
      likelihood: medium
      impact: high
      mitigation: Persist only explicit edit events and prove boot and refresh perform no memory mutation.
    - scenario: A live or scratch test writes real vault or upstream state.
      likelihood: low
      impact: critical
      mitigation: Use tmp_path and :8790 fixtures, instrument billed calls and source writes, and keep :8746 GET-only.
    - scenario: A boolean, fraction, or off-grid value is coerced and becomes durable memory.
      likelihood: medium
      impact: high
      mitigation: Validate type and 5-minute divisibility at API and UI boundaries and test exact round trips.
