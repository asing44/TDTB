architecture_snapshot:
  current_lifecycle:
    backend_duration_resolution:
      entry: GET /plan-inputs in app/main.py
      behavior: resolve_assigned_blocks ignores app/duration_memory.py and returns source-derived blocks.
      gap: Existing durable-memory seam is not imported or supplied with a vault cache path.
    duration_memory_seam:
      file: app/duration_memory.py
      behavior: Optional path persists a flat JSON map with temp-file replacement; default is process memory.
      gap: No production caller, API route, schema envelope, cross-process lock, delete operation, or warning state.
    frontend_context:
      entry: ProductionRoot loads server inputs, then attaches localStorage persistence.
      behavior: tdtb-session-v2 restores same-date overrides and staged sequence after browser refresh.
      invalidation: Date mismatch deletes the blob; shadow, review, acceptance, and live arming never restore.
      gap: A duration edit is only OVERRIDE_SET client state and is lost across dates, browsers, or cleared storage.
    existing_durable_boundaries:
      runstate: Dated vault markdown for day setup, ledgers, selections, and runtime state.
      deferrals: Rolling versioned JSON cache with bounded retention and atomic replace.
      recent_selections: Rolling vault markdown capped at five runs.
  target_boundary:
    path: 00 - META/Cache/tdtb-duration-memory.json under resolved vault_root
    lock_path: Stable sibling .tdtb-duration-memory.lock file that is never replaced with the data file.
    schema: Versioned envelope with monotonic generation, opaque token, and per-entry last-change generation.
    read_path: GET /plan-inputs returns resolved values, labels, revisions, and the current store token.
    write_path: Token-guarded conditional save, item reset, and clear-all mutations.
    lifecycle_triggers:
      load: Every plan-inputs read, including a fresh process or later planning date.
      save: Explicit user duration edit after frontend debounce, never on initial render or restore.
      delete: Item reset removes one identity, then uses the server source fallback and re-fetches inputs.
    clear_all: Explicit clear-all advances generation, rotates token, writes empty state, and cleans eligible temps.
    retention: Entries absent from current assigned inputs remain retained and are removable by clear-all.
    concurrency: Every mutation matches generation, token, and entry revision under one stable sidecar lock.
    lock_timeout: Two seconds by monotonic clock; reads fall back and mutations return a retryable 503.
    durability: Fsync temp, atomic replace, parent fsync, then acknowledge and advance committed state.
    temp_recovery: Never promote temps; remove only proven obsolete copies and preserve newer unknown candidates.
    failure_mode: Reads use source fallback with warning; unsafe mutations fail without claiming success.
    recovery: Clear-all may replace malformed stores under lock and invalidates every earlier writer token.
    ordering:
      committed_state: Only the atomically replaced and directory-fsynced data file is committed.
      mutation: Match expected generation and token, then increment generation and rotate token once.
      entry_revision: A save records the commit generation; reset validates its expected entry revision.
      stale_writer: Any generation, token, or entry-revision mismatch returns 409 without disk mutation.
      crash_before_replace: The old durable file remains authoritative; the candidate temp is never promoted.
      temp_cleanup: Delete only own temps or candidates no newer than durable generation; quarantine newer unknowns.
      corrupt_clear: Explicit clear-all creates a new epoch token under lock and deletes superseded temp copies.

research_digest:
  relevant_files:
    - path: app/duration_memory.py
      finding: Stable identity and atomic path writes exist, but production uses neither.
    - path: app/main.py
      finding: GET /plan-inputs uses a separate resolver without memory or source labels.
    - path: frontend/src/store/persist.ts
      finding: localStorage restores only same-date shaping state and deliberately expires on date change.
    - path: frontend/src/store/controller.ts
      finding: Duration edits dispatch OVERRIDE_SET and only refresh capacity and validation.
    - path: frontend/src/adapters/api.ts
      finding: Existing token refresh and POST behavior can carry a narrow memory mutation.
    - path: frontend/src/adapters/wire.ts
      finding: Assigned projection carries stable path or Todoist ID but no duration source.
    - path: frontend/src/ui/Queue.tsx
      finding: Memory label currently means a transient session override, not durable rehydration.
    - path: app/deferrals.py
      finding: Versioned vault JSON, atomic replace, and graceful read degradation are established patterns.
    - path: app/runstate.py
      finding: Process-local locking assumes one writer and is not enough for required cross-process concurrency.
    - path: app/tests/test_duration_memory_contract.py
      finding: Stable IDs, precedence, and remembered source labels are already contract-tested in isolation.
    - path: frontend/src/ui/BlockEditor.tsx
      finding: Exact duration input accepts and snaps to 5-minute multiples; steppers remain 15-minute jumps.
  digest:
    - The smallest safe feature is integration and hardening of duration memory, not a new context subsystem.
    - Server-side vault persistence is required because browser localStorage is date-scoped and seat-local.
    - Rehydration must precede model projection so every frontend run receives the same resolved source.
    - No production caller supplies a persistence path to the flat store, so no v0 migration is justified.
