architecture_snapshot:
  current_lifecycle:
    backend_duration_resolution:
      entry: GET /plan-inputs in app/main.py
      gap: Source-derived blocks do not consume the existing duration-memory seam.
    duration_memory_seam:
      file: app/duration_memory.py
      gap: No production path, cross-process lock, deletion API, or versioned durable envelope.
    frontend_context:
      entry: ProductionRoot and tdtb-session-v2
      gap: Explicit edits survive a same-day refresh only, not a new date, browser, or server.
    durable_precedent:
      files: app/deferrals.py and app/runstate.py
      note: Existing cache patterns provide versioning and atomic-replace evidence, not full CAS safety.
  target_boundary:
    data_path: 00 - META/Cache/tdtb-duration-memory.json under the resolved vault_root
    lock_path: 00 - META/Cache/.tdtb-duration-memory.lock under the same vault_root
    schema:
      version: 1
      fields:
        - epoch token rotated only by clear-all
        - monotonic commit generation advanced by every committed mutation
        - per-identity record with observable revision, duration, tombstone state, and bounded metadata
    read_path:
      behavior: GET /plan-inputs overlays active records before projection without mutating duration storage.
      output: Resolved duration, source label, epoch, generation, identity revision, and tombstone state.
      allowed_existing_side_effect: Existing local digest_index behavior may remain if current tests prove it.
      prohibited_side_effects: No duration-store write, migration, repair, deletion, billed call, or source write.
    conditional_write:
      mode: Per-entry CAS, never global-generation CAS for save or item reset.
      save_request: Carry canonical identity, exact duration, observed epoch, and expected identity revision.
      reset_request: Carry canonical identity, observed epoch, and expected identity revision.
      save_preconditions: Match epoch token and expected revision for only the target identity.
      reset_preconditions: Match epoch token and expected revision for only the target identity.
      unrelated_ids: Serialize under the lock, re-read fresh state, merge, and never conflict.
      same_id: First commit wins; later stale save or reset receives 409 with no mutation.
      tombstone: Reset commits a new per-ID tombstone revision so delayed expected-null saves fail.
      success_response: Return canonical identity, new revision, tombstone state, epoch, and generation.
      conflict_response: Return deterministic 409 with code, identity, current revision, tombstone, epoch, and generation.
    clear_all:
      request: Carry the observed epoch and generation, or exact corrupt fingerprint and corrupt status.
      supported_precondition: Match both observed epoch and observed global generation.
      corrupt_precondition: Match an exact observed corrupt-byte fingerprint and corrupt status.
      stale_rejection: Any epoch, generation, fingerprint, or status mismatch returns 409 before cleanup.
      commit: Write an empty envelope, advance generation, rotate epoch, and remove all records.
      stale_writer: Prior-epoch save/reset and stale-generation clear-all return 409 without mutation.
      later_save: A save committed after clear-all observation advances generation and blocks that stale clear.
      corrupt_recovery: Confirmed clear-all replaces only the exact corrupt bytes previously observed.
      repaired_race: A repaired or otherwise changed store rejects stale clear with 409 before cleanup.
    client_conflict_policy:
      unrelated_ids: No 409 is emitted because global generation is not a save precondition.
      same_id: Re-fetch current revision and retry once only when the same unambiguous intent is still latest.
      superseded_intent: Cancel retry and preserve the newer reset, clear-all, or edit intent.
      forbidden_retry: Never retry an ambiguous write, delete-after-new-save, corrupt state, or repair state.
      stale_clear: Re-fetch state and require a new explicit clear confirmation; never auto-retry clear-all.
    locking:
      scope: Hold the stable sidecar lock across re-read, CAS, merge, durable write, and cleanup.
      timeout: Two seconds measured by a monotonic clock.
      read_timeout: Return source fallback with a bounded degradation warning.
      mutation_timeout: Return retryable 503 and claim no durable success.
    durability:
      sequence: Lock, re-read, CAS, temp write, temp fsync, atomic replace, cleanup, parent fsync, acknowledge.
      committed_state: Only the replaced data path after parent fsync is authoritative.
      failed_ack: Never report success before both fsync boundaries complete.
    recovery:
      temp_promotion: Never promote any temp candidate.
      owned_temp: The writer removes its unique uncommitted temp after failure while holding the lock.
      orphan_temp: Under the lock, recognized namespace temps are uncommitted and safe to unlink.
      unknown_file: Preserve files outside the exact recognized namespace and report a bounded warning.
      newer_state: Re-read the durable path under lock; never replace or delete its newer generation.
      corrupt_normal_write: Preserve corrupt or unsupported durable bytes and fail closed.
      corrupt_clear_all: Validate fingerprint first, replace with empty state, clean exact temps, fsync parent.
    deletion_evidence:
      item_reset: Active duration is gone, tombstone revision is durable, and source fallback is returned.
      clear_all: Empty envelope, new epoch, no records, no recognized temps, and parent fsync are evidenced.
      fresh_run: A new server and browser show source labels only after reset or clear-all.

