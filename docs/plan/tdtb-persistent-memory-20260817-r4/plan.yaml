pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Unrelated identity saves conflict because a global generation is used as CAS.
      likelihood: medium
      impact: high
      mitigation: Match only epoch and target-ID revision; merge fresh state under the lock.
    - scenario: A delayed save recreates state after item reset or clear-all.
      likelihood: medium
      impact: high
      mitigation: Use reset tombstones; clear-all CASes generation and rotates epoch.
    - scenario: A failed clear-all leaves durable bytes or stale remembered UI state.
      likelihood: medium
      impact: high
      mitigation: Acknowledge only after fsync; apply fallback response and re-fetch with warning states.
    - scenario: Recovery cleanup deletes a newer committed file or active writer candidate.
      likelihood: low
      impact: critical
      mitigation: Hold one lock, re-read durable state, delete only exact uncommitted temp namespace files.
    - scenario: Fresh-run evidence reuses a browser process, profile, or storage partition.
      likelihood: medium
      impact: high
      mitigation: Pin Playwright, launch two OS processes, use distinct profiles, and assert empty stores.
    - scenario: Verification mutates main, live :8746, the real vault, or an upstream source.
      likelihood: low
      impact: critical
      mitigation: Use read-only git comparisons and scratch :8790 with instrumented zero-write counters.
