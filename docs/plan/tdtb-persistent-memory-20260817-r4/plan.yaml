      - Review confirms wire and API expose revision and tombstone and require expected revision.
      - Review confirms 409 responses return current version state and never silently overwrite.
      - Review confirms retries exclude ambiguous, delete-after-save, corrupt, repair, and clear intents.
      - Review confirms tombstones order reset and epoch plus generation CAS orders clear-all.
      - Review confirms a stale clear-all cannot erase a later save or changed corrupt store.
      - Review confirms repaired-store races reject stale clear before cleanup and preserve repaired state.
      - Review confirms two-second lock bounds and fsync, atomic replace, and acknowledgment order.
      - Review confirms recovery never promotes temps or overwrites or deletes newer committed state.
      - Review confirms item reset and clear-all remove values durably and clear stale UI labels.
      - Review confirms source response fallback and re-fetch failure behavior match both contracts.
      - Review confirms exact 5-minute values survive fresh server and clean browser lifetimes.
      - Review confirms bool, fractions, negatives, and off-grid values fail without coercion.
      - Review confirms exact uv, npm, Playwright, and Chromium bootstrap is reproducible.
      - Review confirms all backend and frontend commands passed and bundles were read back.
      - Review confirms zero billed calls, zero real source writes, and no live :8746 requests.
      - Review confirms GET allows only proven current digest-index behavior, not duration/source writes.
      - Review records git status, staged, unstaged, untracked, and git diff --check results.
      - Review compares feature worktree with read-only main and merge-base refs without modifying main.
      - Review rejects any changed path outside approved product, test, package, plan, evidence, or bundle paths.
      - Review confirms no automatic staging or commit and no git add -A or foreign-file staging.
      - Review confirms main and all foreign worktrees, branches, indexes, and processes are unchanged.
      - Review reports no unresolved high-severity security, privacy, isolation, or regression finding.
