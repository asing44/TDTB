acceptance_criteria:
  - Each issue has red-green regression coverage and focused post-change evidence.
  - Duration-memory behavior is not duplicated or reopened without a proven regression.
  - Excluded items cannot consume capacity, enter sequence, or reach commit preview.
  - Native timed tasks remain fixed without opt-in; authorized retimes are scoped and readback-verified.
  - Missing daily notes are true bounded no-ops and do not mask genuine failures.
  - Grouping is deterministic and does not double-count or hide work.
  - The UI is responsive, keyboard-operable, accessible, and truthful about safety state.
  - Full gates, generated-bundle readback, scratch verification, and zero-write evidence pass.

verification_strategy:
  focused_tests: app/tests and frontend/src/**/*.test.{ts,tsx} for each phase
  full_backend: app/.venv/bin/python -m pytest
  full_frontend: [npm test, npm run typecheck, npm run build:mockup, npm run build:prod]
  scratch: fixtures_and_fake_providers_on_8790_only
  live_policy: no_requests_to_8746_and_no_live_mutations
  final_review_owner: orchestrator

risks:
  - id: RISK-001
    text: The dirty timed-task worktree contains partial #4 behavior and must not be imported without ownership reconciliation.
  - id: RISK-002
    text: Calendar capacity-class wording differs between external_sources.py and calendar_bridge.py.
  - id: RISK-003
    text: Name-keyed rows coexist with stable source identities; careless grouping can retarget memory or writes.
  - id: RISK-004
    text: GET /plan-inputs writes a derived digest index and therefore requires temporary vault verification.
  - id: RISK-005
    text: Existing UI projections flatten provenance and validation structure; all visual states must use shared metadata.
  - id: RISK-006
    text: Generated bundle hashes must remain paired with source changes and be read back after builds.

