pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: Live mutation occurs without explicit attended approval.
      likelihood: low
      impact: critical
      mitigation: CUT-02 has a no-write blocked result until approval is recorded.
    - scenario: Source writer is not fully paused before the switch.
      likelihood: medium
      impact: critical
      mitigation: Require process/writer pause proof and receipt stability before CUT-03.
    - scenario: Destination process starts with wrong executable or working directory.
      likelihood: medium
      impact: critical
      mitigation: Compare active identity and launch configuration against canonical preimage checks.
    - scenario: Partial failure leaves neither source nor destination verified.
      likelihood: medium
      impact: critical
      mitigation: Capture source preimage, attempt restoration, verify it, or emit escalation_required.
    - scenario: Health check makes a live write or billed request.
      likelihood: low
      impact: high
      mitigation: Restrict operational proof to bounded read-only checks.
coordination_notes:
