conventions:
  - Never infer approval from a plan or previous user decision.
  - Capture a preimage before any live mutation.
  - Pause, mutate, verify, then resume or rollback with evidence.
  - Use read-only health/version proof after successful activation.
  - Keep the source tree as fallback until successful operational verification.
constraints:
  hard:
    - Do not execute without explicit attended user approval at the cutover gate.
    - Do not start without green migration, rewiring, and implementation handoffs.
    - Do not call billed endpoints or mutate Todoist, Calendar, vault, or other external data.
    - Do not delete the source fallback before successful cutover verification.
    - Do not claim success when rollback or resume is unsafe or unverifiable.
    - Do not alter repository migration or application implementation in this workstream.
  soft:
    - Keep the source consumer ready for immediate rollback during the verification window.
  compatibility:
    - Preserve the launchd label, single-writer contract, and canonical runtime environment.
  security_requirements:
    - Record only bounded process, launch configuration, and health metadata.
    - Never persist credentials, tokens, vault data, or provider payloads in evidence.
