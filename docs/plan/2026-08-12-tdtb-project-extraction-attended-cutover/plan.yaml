  - CUT-02 is the attended approval gate and must block with no writes if absent.
  - CUT-03 captures pause and rollback preimage before mutation.
  - CUT-04 performs the runtime switch only after CUT-02 and CUT-03 are green.
  - CUT-05 owns rollback and resume for success, failure, blocked, or user-stop paths.
  - CUT-06 accepts operational proof or records optional skipped/blocked disposition.
