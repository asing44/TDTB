pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: A UI task reintroduces 24-hour labels while changing nearby layout.
      likelihood: medium
      impact: high
      mitigation: Make FEEDBACK-12 authoritative in every new task and scratch assertion.
    - scenario: Day Setup polish changes layout but leaves the intention textarea hard to read.
      likelihood: medium
      impact: high
      mitigation: Separate copy/readability acceptance from broader Day Setup polish.
    - scenario: Calendar rows overlap only at a width not covered by component tests.
      likelihood: high
      impact: high
      mitigation: Require desktop and narrow-width screenshot-derived browser scenarios.
    - scenario: Results and Preview controls become prominent but obscure write safety gates.
      likelihood: medium
      impact: critical
      mitigation: Preserve exact-write disclosure, two-gate commit, and zero-writer contracts.
    - scenario: Parallel visual changes conflict in shared styles.
      likelihood: medium
      impact: high
      mitigation: Use one design handoff and declare shared-style conflicts between implementers.
    - scenario: Time normalization hides a genuine due-time mismatch.
      likelihood: medium
      impact: critical
      mitigation: Test equivalent encodings and genuinely different instants as separate cases.
    - scenario: Mint blocks write successfully but are not reserved during placement.
      likelihood: high
      impact: critical
      mitigation: Gate write/readback and placement with separate contracts and shared fixtures.
    - scenario: Scratch proof accidentally reaches a live provider.
      likelihood: low
      impact: critical
      mitigation: Require fake adapters and explicit zero-call counters before acceptance.
